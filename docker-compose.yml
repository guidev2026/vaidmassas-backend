services:
  postgres:
    image: postgres:16
    container_name: vaidmassas-db
    restart: always
    environment:
      POSTGRES_DB: vaidmassas
      POSTGRES_USER: vaidmassas_user
      POSTGRES_PASSWORD: vaidmassas123
    ports:
      - "5432:5432"
    volumes:
      - vaidmassas-data:/var/lib/postgresql/data

volumes:
  vaidmassas-data: